site_name: 财报研究
site_description: 公司财报分析与估值报告
docs_dir: reports
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - 报告索引: index.md
